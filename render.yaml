# render.yaml — Render deployment configuration
# Defines both the backend API (Web Service) and frontend (Static Site)
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── Backend: Express + MongoDB API ──────────────────────────────────────────
  - type: web
    name: cohort-api
    runtime: node
    region: singapore   # closest to India; change to oregon/frankfurt if needed
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000        # Render assigns this automatically; keep in sync
      - key: MONGO_URI
        sync: false         # Set this manually in Render dashboard (MongoDB Atlas URI)
      - key: JWT_SECRET
        generateValue: true # Render auto-generates a secure random value
      - key: CLIENT_URL
        sync: false         # Set to your Render static site URL after deploying

  # ── Frontend: React (built with Vite) ────────────────────────────────────────
  - type: web
    name: cohort-client
    runtime: static
    region: singapore
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false         # Set to your cohort-api Render URL, e.g. https://cohort-api.onrender.com/api
      - key: VITE_USE_REAL_API
        value: "true"
